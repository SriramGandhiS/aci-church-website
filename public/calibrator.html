<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ACI Form Coordinate Calibrator</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: monospace;
      background: #1e293b;
      color: #f8fafc;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #hud select {
      background: #334155;
      color: white;
      border: 1px solid #64748b;
      padding: 4px 8px;
      margin-bottom: 8px;
      font-family: monospace;
    }
    #canvas-wrap {
      position: relative;
      width: 1240px;
      height: 1755px;
      margin: 40px auto;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      background: #ffffff;
      user-select: none;
    }
    #bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 1240px;
      height: 1755px;
      pointer-events: none;
    }
    .box-marker {
      position: absolute;
      border: 2px solid #ef4444;
      background: rgba(239, 68, 68, 0.2);
      box-sizing: border-box;
      pointer-events: none;
    }
    .char-preview {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #2563eb;
      background: rgba(37, 99, 235, 0.25);
      color: #1e40af;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      box-sizing: border-box;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div><strong>ACI Calibrator (1240 x 1755 px)</strong></div>
    <div style="margin-top: 6px;">
      <select id="page-select" onchange="changePage(this.value)">
        <option value="page_1.png">Page 1</option>
        <option value="page_2.png">Page 2</option>
        <option value="page_3.png">Page 3</option>
        <option value="page_4.png">Page 4</option>
      </select>
    </div>
    <div id="coords-text">X: 0 px, Y: 0 px</div>
    <div id="pct-text" style="color: #94a3b8; font-size: 11px;">(0%, 0%)</div>
    <div id="click-log" style="margin-top: 6px; font-size: 11px; color: #38bdf8; max-height: 120px; overflow-y: auto;">Click on form to record point</div>
  </div>

  <div id="canvas-wrap">
    <img id="bg-img" src="/official-forms/page_1.png" alt="Form Scan" />
    <div id="overlay-container"></div>
  </div>

  <script>
    const wrap = document.getElementById('canvas-wrap');
    const coordsText = document.getElementById('coords-text');
    const pctText = document.getElementById('pct-text');
    const clickLog = document.getElementById('click-log');
    const bgImg = document.getElementById('bg-img');

    wrap.addEventListener('mousemove', (e) => {
      const rect = wrap.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);
      coordsText.innerText = `X: ${x} px, Y: ${y} px`;
      pctText.innerText = `(${((x/1240)*100).toFixed(2)}%, ${((y/1755)*100).toFixed(2)}%)`;
    });

    wrap.addEventListener('click', (e) => {
      const rect = wrap.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);
      clickLog.innerHTML = `<div>Point: { x: ${x}, y: ${y} } (${((x/1240)*100).toFixed(2)}%, ${((y/1755)*100).toFixed(2)}%)</div>` + clickLog.innerHTML;
    });

    function changePage(page) {
      bgImg.src = '/official-forms/' + page;
    }
  </script>
</body>
</html>
